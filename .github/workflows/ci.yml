name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # manual redeploy from the Actions tab

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run ruff
        run: pipx run ruff check .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: The recorded demo matches the code
        run: |
          python scripts/record_demo.py
          python - <<'PY'
          import json, subprocess
          old = json.loads(subprocess.check_output(["git", "show", "HEAD:web/demo/frames.json"]))
          new = json.load(open("web/demo/frames.json"))
          key = lambda f: json.dumps(f, sort_keys=True)
          assert sorted(map(key, old)) == sorted(map(key, new)), "web/demo/frames.json is stale -- run make demo"
          PY

  docker:
    name: Build container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag incident-response-agent:ci .

      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 incident-response-agent:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 1; done
          docker logs app; exit 1

  # Publishes only web/ (the recorded replay). No server, model, or credentials
  # reach AWS. Skipped until the repository variable AWS_DEPLOY_ROLE_ARN exists,
  # so forks and fresh clones stay green without an AWS account.
  deploy-demo:
    name: Deploy static demo
    needs: [lint, test, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    concurrency: deploy-demo
    permissions:
      contents: read
      id-token: write   # lets the job request a GitHub OIDC token for AWS
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.DEMO_S3_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DEMO_CLOUDFRONT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assume deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload site
        run: aws s3 sync web/ "s3://$S3_BUCKET/" --delete --exclude ".DS_Store"

      - name: Refresh CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

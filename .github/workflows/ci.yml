name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # manual redeploy from the Actions tab

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Compile application modules
        run: python -m compileall -q app tools

      - name: Run tests
        env:
          MOCK: "1"
        run: python -m pytest

  docker:
    name: Build container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag incident-response-agent:ci .

  # Publishes only web/ (the recorded replay). No server, model, or credentials
  # reach AWS. Skipped until the repository variable AWS_DEPLOY_ROLE_ARN exists,
  # so forks and fresh clones stay green without an AWS account.
  deploy-demo:
    name: Deploy static demo
    needs: [test, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    concurrency: deploy-demo
    permissions:
      contents: read
      id-token: write   # lets the job request a GitHub OIDC token for AWS
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.DEMO_S3_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DEMO_CLOUDFRONT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assume deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload site
        run: aws s3 sync web/ "s3://$S3_BUCKET/" --delete --exclude ".DS_Store"

      - name: Refresh CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
